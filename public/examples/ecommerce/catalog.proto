syntax = "proto3";

package ecommerce.catalog;

import "common.proto";

// Product category. Categories may form a hierarchy via parent_id.
message Category {
  string id = 1;
  string name = 2;
  string parent_id = 3; // empty for top-level categories
}

// Catalog item available for purchase.
message Product {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  ecommerce.common.Money price = 5;
  ProductStatus status = 6;
  repeated string category_ids = 7;
  repeated string tags = 8;
  // Free-form attributes (color, size, material, ...).
  map<string, string> attributes = 9;
  int32 stock_quantity = 10;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  OUT_OF_STOCK = 2;
  DISCONTINUED = 3;
  DRAFT = 4;
}
